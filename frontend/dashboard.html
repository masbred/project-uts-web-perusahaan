<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Utama - Nusantara Tech Solutions</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html"
          >MJM Management Admin</a
        >
        <div class="d-flex align-items-center gap-3">
          <span class="text-light small" id="userBadge"></span>
          <button onclick="handleLogout()" class="btn btn-danger btn-sm">
            Logout
          </button>
        </div>
      </div>
    </nav>

    <main class="container my-5 flex-grow-1">
      <div class="alert alert-success">
        Selamat datang di <strong>Halaman Menu Utama</strong>! Anda berhasil
        login ke sistem manajemen informasi perusahaan.
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-header bg-white fw-bold">
          Daftar Data Informasi Perusahaan
        </div>
        <div class="card-body table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Judul Informasi</th>
                <th>Kategori</th>
                <th>Tanggal</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="dashboardTable">
              <!-- Data dirender dari js/app.js -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <div class="container">
        <small>@Copyright by 24552011225_Muhammad Fathal Mustaqim_TIF RP 24E CNS</small>
      </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
      // Proteksi halaman agar tidak bisa diakses tanpa login
      if (localStorage.getItem("isLoggedIn") !== "true") {
        window.location.href = "login.html";
      }

      document.getElementById("userBadge").textContent =
        localStorage.getItem("activeUser");

      const tableBody = document.getElementById("dashboardTable");
      companyData.forEach((item) => {
        tableBody.innerHTML += `
        <tr>
          <td>${item.id}</td>
          <td class="fw-semibold">${item.title}</td>
          <td><span class="badge bg-secondary">${item.category}</span></td>
          <td>${item.date}</td>
          <td><a href="detail.html?id=${item.id}" class="btn btn-sm btn-primary">Preview</a></td>
        </tr>
      `;
      });
    </script>
  </body>
</html>
