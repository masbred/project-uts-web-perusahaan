<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beranda - Nusantara Tech Solutions</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">MJM Management</a>
        <div class="d-flex gap-2">
          <a href="login.html" class="btn btn-outline-light btn-sm">Login</a>
          <a href="register.html" class="btn btn-primary btn-sm">Registrasi</a>
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <header class="bg-primary text-white py-5 mb-4">
      <div class="container text-center">
        <h1 class="fw-bold">MJM Management Solutions</h1>
        <p class="lead mb-0">
          Portal Informasi Layanan, Berita, dan Inovasi Teknologi Perusahaan
        </p>
      </div>
    </header>

    <!-- Kumpulan Informasi Perusahaan -->
    <main class="container mb-5 flex-grow-1">
      <h4 class="mb-4 fw-semibold">Informasi & Layanan Perusahaan</h4>
      <div class="row g-4" id="infoContainer">
        <!-- Card informasi dirender otomatis dari js/app.js -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <div class="container">
        <small>@Copyright by 24552011225_Muhammad Fathal Mustaqim_TIF RP 24E CNS</small>
      </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
      const container = document.getElementById("infoContainer");
      companyData.forEach((item) => {
        container.innerHTML += `
        <div class="col-md-4">
          <div class="card h-100 shadow-sm border-0">
            <div class="card-body d-flex flex-column">
              <span class="badge bg-primary-subtle text-primary align-self-start mb-2">${item.category}</span>
              <h5 class="card-title fw-bold">${item.title}</h5>
              <p class="text-muted small mb-2">${item.date}</p>
              <p class="card-text flex-grow-1">${item.summary}</p>
              <a href="detail.html?id=${item.id}" class="btn btn-outline-primary btn-sm mt-3">Lihat Detail</a>
            </div>
          </div>
        </div>
      `;
      });
    </script>
  </body>
</html>
