<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Informasi - Nusantara Tech Solutions</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">MJM Management</a>
        <a href="index.html" class="btn btn-outline-light btn-sm"
          >Kembali ke Beranda</a
        >
      </div>
    </nav>

    <main class="container my-5 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm border-0 p-4" id="detailContainer">
            <!-- Detail konten dimuat via JS -->
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <div class="container">
        <small>@Copyright by 24552011225_Muhammad Fathal Mustaqim_TIF RP 24E CNS</small>
      </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const infoId = parseInt(params.get("id"));
      const selectedInfo = companyData.find((item) => item.id === infoId);
      const detailContainer = document.getElementById("detailContainer");

      if (selectedInfo) {
        detailContainer.innerHTML = `
        <span class="badge bg-primary align-self-start mb-2">${selectedInfo.category}</span>
        <h2 class="fw-bold mb-1">${selectedInfo.title}</h2>
        <p class="text-muted small mb-4">Dipublikasikan pada: ${selectedInfo.date}</p>
        <hr>
        <p class="fs-5 lh-base mt-3">${selectedInfo.content}</p>
        <div class="mt-4">
          <a href="index.html" class="btn btn-secondary btn-sm">&larr; Kembali ke Daftar Informasi</a>
        </div>
      `;
      } else {
        detailContainer.innerHTML = `
        <div class="alert alert-warning mb-0">
          Informasi tidak ditemukan. Silakan pilih informasi dari <a href="index.html">Halaman Utama</a>.
        </div>
      `;
      }
    </script>
  </body>
</html>
