<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Nusantara Tech Solutions</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">MJM Management</a>
      </div>
    </nav>

    <main class="container my-auto py-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm border-0 p-4">
            <h4 class="fw-bold text-center mb-3">Login Sistem</h4>
            <div
              id="loginAlert"
              class="alert alert-danger d-none small"
              role="alert"
            ></div>

            <form onsubmit="handleLogin(event)">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email</label>
                <input
                  type="text"
                  class="form-control"
                  id="loginEmail"
                  placeholder="admin"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="loginPassword"
                  placeholder="admin123"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary w-100">Masuk</button>
            </form>

            <p class="text-center small mt-3 mb-0">
              Belum punya akun? <a href="register.html">Daftar di sini</a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <div class="container">
        <small>@Copyright by 24552011225_Muhammad Fathal Mustaqim_TIF RP 24E CNS</small>
      </div>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
